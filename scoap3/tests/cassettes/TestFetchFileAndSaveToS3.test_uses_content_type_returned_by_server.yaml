interactions:
- request:
    body: null
    headers:
      Accept:
      - '*/*'
      Accept-Encoding:
      - gzip, deflate
      Connection:
      - keep-alive
    method: GET
    uri: https://example.org/files/article.xml
  response:
    body:
      string: '<article><title>Sample article</title></article>'
    headers:
      content-type:
      - text/xml
    status:
      code: 200
      message: OK
version: 1
